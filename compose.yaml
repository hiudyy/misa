services:
  misa:
    build:
      context: .
      args:
        MISA_COMMIT_SHA: ${MISA_COMMIT_SHA:-unknown}
    image: misa-bot:1.1.0
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
      - ./dados:/app/dados
    deploy:
      resources:
        limits:
          cpus: '1.0'
